name: Lern-Erinnerung

on:
  schedule:
    - cron: '17 * * * *'   # stündlich; das Skript entscheidet, ob jetzt jemand erinnert wird
  workflow_dispatch:
    inputs:
      force:
        description: 'Test: sofort an alle Geräte senden'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node scripts/reminder.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
